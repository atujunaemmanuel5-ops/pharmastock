services:
  - type: web
    name: pharmastock-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PHARMASTOCK_AUTH_REQUIRED
        value: "true"
      - key: PHARMASTOCK_DB_BACKEND
        value: sqlite
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PHARMASTOCK_API_KEY
        sync: false
      - key: PHARMASTOCK_ADMIN_KEY
        sync: false
      - key: PHARMASTOCK_FRONTEND_ORIGINS
        sync: false
